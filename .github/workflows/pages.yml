name: Pages

on:
  push:
    branches: [main]
  # Pick up sites published in other repositories without touching this one.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A scheduled run and a push run must not deploy over each other, but a queued
# rebuild is always worth finishing, so in-progress runs are left alone.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate the index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_USER: ${{ github.repository_owner }}
        run: python3 tools/generate.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
